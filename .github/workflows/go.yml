name: Go CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GO_VERSION: '1.25.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      # ======================
      # 🧹 Verify formatting (cross-platform)
      # ======================
      - name: Verify formatting (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          FILES=$(git ls-files '*.go')
          if [ -z "$FILES" ]; then
            echo "No Go files to check."
            exit 0
          fi
          CHANGED=$(echo "$FILES" | xargs gofmt -s -l)
          if [ -n "$CHANGED" ]; then
            echo "Found files with formatting issues:"
            echo "$CHANGED"
            echo "To fix locally: gofmt -s -w ."
            exit 1
          fi

      - name: Verify formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = git ls-files '*.go'
          if (-not $files) {
            Write-Host "No Go files to check."
            exit 0
          }
          $changed = ($files | ForEach-Object { gofmt -s -l $_ }) | Where-Object { $_ -ne "" }
          if ($changed) {
            Write-Host "Found files with formatting issues:"
            $changed
            Write-Host "To fix locally: gofmt -s -w ."
            exit 1
          }

      # ======================
      # 🧠 Vet, Build, Test
      # ======================
      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v
