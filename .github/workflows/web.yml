name: Web CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web/web-client/**'
      - 'web/web-admin/**'
      - 'web/ui/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'web/web-client/**'
      - 'web/web-admin/**'
      - 'web/ui/**'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        app: [web-client, web-admin]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先安装 pnpm，再让 setup-node 使用 pnpm 缓存，避免因未找到 pnpm 导致缓存路径解析失败
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace dependencies (root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build UI library first (@vistack/ui)
        run: pnpm -F @vistack/ui build
        working-directory: .

      - name: Type check and build
        run: pnpm build

      - name: Upload web build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist-${{ matrix.os }}
          path: web/${{ matrix.app }}/dist
