[minio]
endpoint = "localhost:2591"
public_endpoint = "localhost:2591" # Public address for frontend (e.g. minio.example.com)
access_key = "minioadmin"
secret_key = "c9jA9ZvNXLwfs6n6fog6EJ0396Q77TbEm6G1XeDQbFG02GYwBsMh5wcTeJFzquD6sYE5saMGsrLnXernC5VaxjNfUuKqZxGRh9wf"
secure = false
bucket = "vistack"

[database]
host = "localhost"
port = 5432
user = "postgres"
password  = "postgres"
name = "postgres"
max_idle_conns = 10
max_open_conns = 100
conn_max_lifetime = 3600

[server]
port = 8080
host = "0.0.0.0"
# web_dir = "./build/web-client" # 本地托管前端产物时取消注释（需先 pnpm --filter web-client build）

[auth]
kid = "vistack-rs256" # JWT key id
issuer = "vistack"
jwt_expiration = 3600
jwks_path = "/.well-known/jwks.json"

[redis]
host = "127.0.0.1"
port = 6379
db = 0
password = ""
pool_size = 10

[cache]
enabled = true
default_ttl_min = 300
default_ttl_max = 600
null_ttl = 60
lock_ttl = 5
lock_wait_ms = 2000
recommend_ttl = 300
bloom_enabled = true
bloom_bits = 10000000
bloom_hashes = 7

[ratelimit]
enabled = true
algorithm = "sliding_window"
token_rate = 10
token_burst = 20
window = 60
limit = 100

[social]
enabled = true
flush_interval = 5
flush_batch = 200
leaderboard_size = 50

[danmaku]
enabled = true
local_cache_size = 1024
local_cache_ttl = 2
cache_control_max_age = 5

[comment]
enabled = true
flush_interval = 5
flush_batch = 200

[snowflake]
node_id = 0 # 0 = 自动从实例标识(hostname/POD_IP)派生，多副本避免 ID 冲突

[kafka]
brokers = ["localhost:9092"]
group_id = "vistack-consumer-group"
concurrency = 4 # 每个 worker 实例的并发消费者数，默认 4

[cors]
enable = true
allow_origins = ["http://localhost:8334", "http://localhost:8335"]
allow_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allow_headers = ["Content-Type", "Authorization", "X-Requested-With"]
allow_credentials = true

[etcd]
endpoints = ["localhost:2379"]
prefix = "/vistack/transcoders"
leader_ttl = 10 # 领导选举租约 TTL 秒，默认 10

[transcoder]
listen_addr = ":50051"
addr = "localhost:50051"
use_etcd = true

[auth_service]
http_addr = ":8081"
grpc_addr = ":50052"
jwks_url = "http://127.0.0.1:8081/.well-known/jwks.json"
