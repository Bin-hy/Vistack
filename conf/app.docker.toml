# Docker 容器内部配置：所有地址使用 compose/k8s 服务名，凭证与 .env.local 对齐。
# 通过环境变量 VISTACK_CONFIG_PATH=/app/conf/app.docker.toml 指定。

[minio]
endpoint = "minio:9000"            # 容器网络内部 S3 API
public_endpoint = "localhost:9000" # 前端浏览器访问（与 compose 的 9000->9000 端口映射对齐）
access_key = "minioadmin"
secret_key = "minioadmin"
secure = false
bucket = "vistack"

[database]
host = "postgres"
port = 5432
user = "postgres"
password = "postgres"
name = "postgres"
max_idle_conns = 10
max_open_conns = 100
conn_max_lifetime = 3600

[server]
port = 8080
host = "0.0.0.0"

[auth]
kid = "vistack-rs256"
issuer = "vistack"
jwt_expiration = 3600
jwks_path = "/.well-known/jwks.json"

[redis]
host = "redis"
port = 6379
db = 0
password = ""
pool_size = 10

[cache]
enabled = true
default_ttl_min = 300
default_ttl_max = 600
null_ttl = 60
lock_ttl = 5
lock_wait_ms = 2000
recommend_ttl = 300
bloom_enabled = true
bloom_bits = 10000000
bloom_hashes = 7

[ratelimit]
enabled = true
algorithm = "sliding_window"
token_rate = 10
token_burst = 20
window = 60
limit = 100

[social]
enabled = true
flush_interval = 5
flush_batch = 200
leaderboard_size = 50

[danmaku]
enabled = true
local_cache_size = 1024
local_cache_ttl = 2
cache_control_max_age = 5

[comment]
enabled = true
flush_interval = 5
flush_batch = 200

[snowflake]
node_id = 0 # 0 = 自动从实例标识(hostname/POD_IP)派生，多副本避免 ID 冲突

[kafka]
brokers = ["kafka:29092"] # 容器内使用内部 listener（compose 的 PLAINTEXT://kafka:29092）
group_id = "vistack-consumer-group"
concurrency = 4

[cors]
enable = true
allow_origins = ["http://localhost:8334", "http://localhost:8335"]
allow_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allow_headers = ["Content-Type", "Authorization", "X-Requested-With"]
allow_credentials = true

[etcd]
endpoints = ["etcd:2379"]
prefix = "/vistack/transcoders"
leader_ttl = 10

[transcoder]
listen_addr = ":50051"
addr = "transcoder:50051"
use_etcd = true

[auth_service]
http_addr = ":8081"
grpc_addr = ":50052"
jwks_url = "http://auth:8081/.well-known/jwks.json"
