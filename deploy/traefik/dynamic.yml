# Traefik 动态配置：统一入口按路径分流
#   /api/v1/auth/*  → auth:8081（认证）
#   /api/v1/user/*  → auth:8081（用户资料）
#   其余 /api/v1/*  → api:8080（视频/文件业务）
#   其余 /          → api:8080（前端页面，由 api 托管构建产物）
http:
  routers:
    auth-router:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/user`)"
      service: auth-service
      priority: 20
    api-router:
      entryPoints: ["web"]
      rule: "PathPrefix(`/api/v1`)"
      service: api-service
      priority: 10
    # 兜底：页面请求（含静态资源与 SPA 路由）全部代理到 api 托管
    web-router:
      entryPoints: ["web"]
      rule: "PathPrefix(`/`)"
      service: api-service
      priority: 1

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth:8081"
    api-service:
      loadBalancer:
        servers:
          - url: "http://api:8080"
