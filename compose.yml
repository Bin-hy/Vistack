services:
  postgres:
    image: postgres:16-alpine
    container_name: vistack-postgres
    env_file:
      - .env.local
    # environment:
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vistack-redis
    env_file:
      - .env.local
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: video-dash-minio
    command: server /data --console-address ":${MINIO_WEB_PORT:-9000}"
    env_file:
      - .env.local
    # environment:
    #   MINIO_ROOT_USER: ${MINIO_USER}
    #   MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "${MINIO_WEB_PORT:-9000}:9000"
      - "${MINIO_API_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
