services:
  postgres:
    image: postgres:16-alpine
    container_name: vistack-postgres
    env_file:
      - .env.local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vistack-redis
    env_file:
      - .env.local
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: video-dash-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env.local
    ports:
      - "${MINIO_WEB_PORT:-9000}:9000"
      - "${MINIO_API_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: vistack-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafkadata:/var/lib/kafka/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: vistack-etcd
    command: >
      etcd
      --name vistack-etcd
      --advertise-client-urls http://etcd:2379
      --listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd-data
    ports:
      - "2379:2379"
    volumes:
      - etcddata:/etcd-data

  api:
    build:
      context: .
      target: vistack
    image: vistack:latest
    container_name: vistack-api
    environment:
      VISTACK_CONFIG_PATH: /app/conf/app.docker.toml
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      kafka:
        condition: service_started
    command: ["api"]

  worker:
    build:
      context: .
      target: vistack
    image: vistack:latest
    container_name: vistack-worker
    environment:
      VISTACK_CONFIG_PATH: /app/conf/app.docker.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      kafka:
        condition: service_started
      etcd:
        condition: service_started
    command: ["worker"]

  transcoder:
    build:
      context: .
      target: vistack-transcoder
    image: vistack-transcoder:latest
    environment:
      VISTACK_CONFIG_PATH: /app/conf/app.docker.toml
    depends_on:
      minio:
        condition: service_started
      etcd:
        condition: service_started
    command: ["transcoder"]
    # 水平扩容：docker compose up --scale transcoder=3

volumes:
  pgdata:
  redisdata:
  miniodata:
  kafkadata:
  etcddata:
